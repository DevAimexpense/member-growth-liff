<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ค้นหาสมาชิก · BNI</title>
<style>
  :root{
    --red:#C1121F; --red-strong:#8E0E17; --red-tint:#FCE9E9;
    --ink:#1B2126; --body:#3A444C; --muted:#66727C; --faint:#9AA6AF;
    --bg:#EEF0F2; --surface:#FFFFFF; --hair:#EAECEF; --hair-strong:#D8DCE0; --line:#06C755;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun","Prompt",sans-serif}
  .top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--red),var(--red-strong));color:#fff;padding:16px 16px 14px;box-shadow:0 6px 18px -10px rgba(0,0,0,.5)}
  .top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.2px}
  .top .sub{font-size:12px;opacity:.9;margin-top:2px}
  .search{margin-top:12px;position:relative}
  .search input{width:100%;border:0;border-radius:12px;padding:12px 14px 12px 40px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .search .mag{position:absolute;left:13px;top:11px;font-size:17px;opacity:.6}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--hair-strong);background:#fff;color:var(--body);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff}
  .wrap{padding:8px 14px 40px;max-width:560px;margin:0 auto}
  .count{font-size:12px;color:var(--muted);font-weight:600;padding:8px 4px}
  .card{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:13px;align-items:center;box-shadow:0 6px 20px -14px rgba(20,10,12,.5)}
  .av{width:54px;height:54px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:linear-gradient(135deg,var(--red),var(--red-strong));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
  .info{flex:1;min-width:0}
  .nm{font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.2}
  .nk{font-size:12.5px;color:var(--muted);font-weight:600}
  .co{font-size:12.5px;color:var(--body);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:var(--red-strong);background:var(--red-tint);padding:2px 8px;border-radius:999px}
  .acts{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
  .btn{border:0;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;justify-content:center}
  .btn.send{background:var(--red);color:#fff;box-shadow:0 6px 14px -6px rgba(193,18,31,.6)}
  .btn.view{background:#fff;color:var(--body);border:1.5px solid var(--hair-strong)}
  .btn:active{transform:scale(.96)}
  .state{padding:60px 24px;text-align:center;color:var(--muted)}
  .state .em{font-size:40px}
  .spin{width:34px;height:34px;border:4px solid #e2e5e8;border-top-color:var(--red);border-radius:50%;margin:60px auto;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);opacity:0;background:#1B2126;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:.25s;pointer-events:none;z-index:99;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
  <div class="top">
    <h1>🔎 ค้นหาสมาชิก</h1>
    <div class="sub" id="sub">BNI Chapter Directory</div>
    <div class="search"><span class="mag">🔍</span><input id="q" placeholder="พิมพ์ ชื่อ / บริษัท / หมวด เช่น ทนาย"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="wrap">
    <div class="count" id="count"></div>
    <div id="list"><div class="spin"></div></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ===== config =====
    var LIFF_ID = '2011081199-z0XlcxW0';
    var EXEC = 'https://script.google.com/macros/s/AKfycbxqirgC_ScsG8qSqCjE0Xs--9LLgBRhmfWzPPV9w1-ysokCS2-WtZY5nPmSgKvtCn-XWQ/exec';
    // ==================
    var ALL=[], CAT='', Q='';
    function h(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function attr(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
    function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
    function initials(n){var p=String(n||'').trim().split(/\s+/);return ((p[0]||' ')[0]+(p[1]||'')[0]||'').toUpperCase()||'👤';}
    function cardLink(id){return EXEC+'?page=card&m='+encodeURIComponent(id);}
    function telHref(p){return 'tel:'+String(p||'').replace(/[^0-9+]/g,'');}

    // ---- JSONP โหลดรายชื่อ ----
    function loadDir(){
      window.__onDir=function(d){ ALL=(d&&d.members)||[]; document.getElementById('sub').textContent=(d&&d.chapter?('BNI '+d.chapter+' · '+ALL.length+' สมาชิก'):'Directory'); buildChips(); render(); };
      var s=document.createElement('script');
      s.src=EXEC+'?api=directory&callback=__onDir&_='+Date.now();
      s.onerror=function(){ document.getElementById('list').innerHTML='<div class="state"><div class="em">⚠️</div><div style="margin-top:8px">โหลดรายชื่อไม่สำเร็จ</div></div>'; };
      document.body.appendChild(s);
    }

    function buildChips(){
      var set={}; ALL.forEach(function(m){ if(m.category) set[m.category]=(set[m.category]||0)+1; });
      var cats=Object.keys(set).sort(function(a,b){return set[b]-set[a];});
      var html='<div class="chip'+(CAT===''?' on':'')+'" data-c="">ทั้งหมด</div>';
      html+=cats.map(function(c){return '<div class="chip'+(CAT===c?' on':'')+'" data-c="'+attr(c)+'">'+h(c)+'</div>';}).join('');
      var el=document.getElementById('chips'); el.innerHTML=html;
      [].forEach.call(el.querySelectorAll('.chip'),function(ch){ ch.onclick=function(){ CAT=ch.getAttribute('data-c'); buildChips(); render(); }; });
    }

    function filtered(){
      var q=Q.trim().toLowerCase();
      return ALL.filter(function(m){
        if(CAT && m.category!==CAT) return false;
        if(!q) return true;
        return [m.name,m.nick,m.company,m.category].some(function(x){return String(x||'').toLowerCase().indexOf(q)>=0;});
      });
    }

    function render(){
      var rows=filtered();
      document.getElementById('count').textContent=rows.length?('พบ '+rows.length+' คน'):'';
      var list=document.getElementById('list');
      if(!rows.length){ list.innerHTML='<div class="state"><div class="em">🔍</div><div style="margin-top:8px">ไม่พบสมาชิกที่ตรงกับที่ค้นหา</div></div>'; return; }
      list.innerHTML=rows.map(function(m,i){
        var av=m.photoUrl?('<img class="av" src="'+attr(m.photoUrl)+'" alt="" onerror="this.outerHTML=&quot;<div class=\\&quot;av\\&quot;>'+h(initials(m.name))+'</div>&quot;">'):('<div class="av">'+h(initials(m.name))+'</div>');
        return '<div class="card">'+av+
          '<div class="info"><div class="nm">'+h(m.name)+'</div>'+(m.nick?'<div class="nk">('+h(m.nick)+')</div>':'')+
            (m.company?'<div class="co">'+h(m.company)+'</div>':'')+(m.category?'<div class="cat">'+h(m.category)+'</div>':'')+'</div>'+
          '<div class="acts"><button class="btn send" data-i="'+i+'">📤 ส่งการ์ด</button>'+
            '<button class="btn view" data-i="'+i+'">👁 ดูตัวอย่าง</button></div></div>';
      }).join('');
      [].forEach.call(list.querySelectorAll('.btn.send'),function(b){ b.onclick=function(){ sendCard(rows[+b.getAttribute('data-i')]); }; });
      [].forEach.call(list.querySelectorAll('.btn.view'),function(b){ b.onclick=function(){ openCard(rows[+b.getAttribute('data-i')]); }; });
    }

    function openCard(m){
      var url=cardLink(m.id);
      if(window.liff && liff.openWindow){ liff.openWindow({url:url, external:true}); } else { window.open(url,'_blank'); }
    }

    // ---- สร้าง Flex นามบัตร ----
    function buildFlex(m){
      var link=cardLink(m.id);
      var bubble={ type:'bubble', size:'mega' };
      if(m.photoUrl && /^https:\/\//i.test(m.photoUrl)){
        bubble.hero={ type:'image', url:m.photoUrl, size:'full', aspectRatio:'20:13', aspectMode:'cover',
          action:{ type:'uri', label:'โปรไฟล์', uri:link } };
      }
      var bodyContents=[
        { type:'text', text:'BNI นามบัตรสมาชิก', size:'xs', color:'#C1121F', weight:'bold' },
        { type:'text', text:String(m.name||'-'), size:'xl', weight:'bold', color:'#1B2126', wrap:true, margin:'sm' }
      ];
      if(m.nick) bodyContents.push({ type:'text', text:'('+m.nick+')', size:'sm', color:'#66727C', margin:'xs' });
      if(m.company) bodyContents.push({ type:'text', text:m.company, size:'sm', color:'#3A444C', wrap:true, margin:'md' });
      if(m.category) bodyContents.push({ type:'text', text:'• '+m.category, size:'sm', color:'#8E0E17', weight:'bold', margin:'xs' });

      var footer=[ { type:'button', style:'primary', color:'#C1121F', height:'sm',
        action:{ type:'uri', label:'เปิดโปรไฟล์', uri:link } } ];
      var mini=[];
      if(m.phone) mini.push({ type:'button', style:'link', height:'sm', action:{ type:'uri', label:'โทร', uri:telHref(m.phone) } });
      if(m.lineUrl) mini.push({ type:'button', style:'link', height:'sm', action:{ type:'uri', label:'LINE', uri:m.lineUrl } });
      if(mini.length) footer.push({ type:'box', layout:'horizontal', spacing:'sm', contents:mini });

      bubble.body={ type:'box', layout:'vertical', contents:bodyContents };
      bubble.footer={ type:'box', layout:'vertical', spacing:'sm', contents:footer };
      return bubble;
    }

    async function sendCard(m){
      if(!(window.liff && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker'))){
        toast('อุปกรณ์นี้แชร์การ์ดไม่ได้ ลองเปิดในแอป LINE'); return;
      }
      try{
        var res=await liff.shareTargetPicker(
          [{ type:'flex', altText:'นามบัตร '+String(m.name||'').slice(0,60), contents:buildFlex(m) }],
          { isMultiple:true }
        );
        if(res){ toast('ส่งนามบัตร '+(m.nick||m.name)+' แล้ว ✅'); }
        else { toast('ยกเลิกการส่ง'); }
      }catch(e){ toast('ส่งไม่สำเร็จ: '+((e&&e.message)||e)); }
    }

    // ---- boot ----
    document.getElementById('q').addEventListener('input',function(e){ Q=e.target.value; clearTimeout(window.__t); window.__t=setTimeout(render,180); });
    (async function(){
      try{
        await liff.init({ liffId: LIFF_ID });
        if(!liff.isLoggedIn()){ liff.login({}); return; }
        loadDir();
      }catch(e){
        // ยังโหลด directory ต่อได้ (ดู/ค้นหา) แม้ liff มีปัญหา — แต่ส่งการ์ดต้องอยู่ในแอป LINE
        document.getElementById('sub').textContent='เปิดใน LINE เพื่อส่งการ์ดได้';
        loadDir();
      }
    })();
  </script>
</body>
</html>
