<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Member Growth</title>
<style>
  :root{--red:#B71C1C;--red-d:#7F0000;--grey-5:#757575;--bg:#F4F4F5;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"Helvetica Neue","Sarabun","Prompt",sans-serif;color:var(--grey-5)}
  .box{text-align:center;padding:24px}
  .logo{font-size:20px;font-weight:800;color:var(--red-d)}
  .sub{font-size:13px;margin-top:6px}
  .spin{width:38px;height:38px;border:4px solid #e5e0e0;border-top-color:var(--red);border-radius:50%;
    margin:22px auto;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:var(--red-d);font-size:13px;word-break:break-word;max-width:320px;margin:12px auto 0}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🚦 Member Growth</div>
    <div class="spin" id="spin"></div>
    <div class="sub" id="msg">กำลังเข้าสู่ระบบ…</div>
    <div class="err" id="err"></div>
  </div>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ===== ตั้งค่า =====
    var LIFF_ID = '2011081199-z0XlcxW0';
    var GAS = 'https://script.google.com/macros/s/AKfycbxqirgC_ScsG8qSqCjE0Xs--9LLgBRhmfWzPPV9w1-ysokCS2-WtZY5nPmSgKvtCn-XWQ/exec';
    // ==================
    function fail(m){ document.getElementById('spin').style.display='none'; document.getElementById('msg').textContent='เปิดไม่สำเร็จ'; document.getElementById('err').textContent=String(m); }
    var params = new URLSearchParams(location.search);
    var page = params.get('page');
    if(!page){ // LIFF บางกรณีห่อ query ไว้ใน liff.state
      var st = params.get('liff.state');
      if(st){ try{ page = new URLSearchParams(st.charAt(0)==='?'?st.slice(1):st).get('page'); }catch(e){} }
    }
    page = page || 'home';
    (async function(){
      try{
        await liff.init({ liffId: LIFF_ID });
        if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
        var p = await liff.getProfile();
        // ส่งต่อไปหน้าเว็บแอปพร้อม userId (google.script.run ทำงานได้)
        location.replace(GAS + '?page=' + encodeURIComponent(page) + '&u=' + encodeURIComponent(p.userId));
      }catch(e){ fail((e && (e.message||e)) || 'unknown'); }
    })();
  </script>
</body>
</html>
